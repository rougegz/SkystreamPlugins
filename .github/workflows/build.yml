name: Build and Deploy Repository

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout plugin sources (rougegz/SkystreamPlugins)
        uses: actions/checkout@v4
        with:
          repository: rougegz/SkystreamPlugins
          ref: main
          path: sources

      - name: Stage plugin sources
        run: |
          shopt -s nullglob
          for d in sources/*/; do
            name=$(basename "$d")
            if [ -f "$d/plugin.json" ] && [ ! -d "$name" ]; then
              cp -r "$d" "$name"
            fi
          done
          ls -d */ | grep -v -E '^(dist|sources|\.github)$'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Repository
        run: |
          npm install -g skystream-cli
          skystream deploy -u https://raw.githubusercontent.com/${{ github.repository }}/main

      - name: Commit and Push changes
        run: |
          git config --global user.name "rougegz"
          git config --global user.email "rougegz@users.noreply.github.com"
          git add dist repo.json
          git commit -m "chore: automated deploy [skip ci]" || echo "No changes to commit"
          git push
